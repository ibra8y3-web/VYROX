name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, lint, and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Test diagnostics and pinned source manifests
        run: |
          python3 -m unittest discover -s scripts/tests -p "test_*.py"
          python3 scripts/check_proot_manifest.py

      - name: Run unit tests, lint, and assemble debug APK
        run: |
          set -o pipefail
          gradle --no-daemon :runtime-engine:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/vyrox-gradle-build.log"

      - name: Generate build failure diagnostic
        if: failure()
        run: |
          python3 scripts/diagnose_build_failure.py --input "$RUNNER_TEMP/vyrox-gradle-build.log" --output "$RUNNER_TEMP/vyrox-build-diagnostic.md" --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat "$RUNNER_TEMP/vyrox-build-diagnostic.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vyrox-build-diagnostic
          path: ${{ runner.temp }}/vyrox-build-diagnostic.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vyrox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
