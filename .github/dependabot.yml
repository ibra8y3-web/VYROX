version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      kotlin-plugins:
        patterns:
          - "org.jetbrains.kotlin.*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "com.android.application"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
